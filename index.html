<html lang="vi">
<head>
<!-- Văn Phòng AI · Bản quyền (c) 2026 Phạm Linh · toihocai.com · Không được bán lại. Xem LICENSE. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Văn Phòng AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: thanh đầu · cột trái danh sách phòng ban · giữa là thẻ số + văn phòng 2.5D quanh Second Brain · dải việc chạy dưới cùng */
:root{
  --accent:#ff8a00;
  --bg:#070814; --bg2:#0d1024; --panel:#11152e; --line:#232a52; --text:#e8ebff; --muted:#8a92c4;
  --sanh:#0b0e22; --luoi:#1e2550; --nhan-nen:#0b0e22; --ban-mat:#8a6440; --ban-1:#3a2a1c; --ban-2:#4a3522;
  --bot-dau:#f4f6ff; --bot-than:#1d2448; --bot-vien:#8ea0ff; --cham-tat:#4a5180;
  --cyan:#22d3ee; --pink:#ff4d6d; --purple:#c13cff; --gold:#ffc84a; --green:#34d399; --blue:#5b8cff;
  --font:"Be Vietnam Pro","Segoe UI",Arial,sans-serif; --so:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef1f8; --bg2:#ffffff; --panel:#ffffff; --line:#d6dbea; --text:#151a33; --muted:#5f6787;
  --sanh:#f7f8fc; --luoi:#dde2ef; --nhan-nen:#ffffff; --ban-mat:#c9a37a; --ban-1:#8a6a4a; --ban-2:#a07b55;
  --bot-dau:#ffffff; --bot-than:#2a3360; --bot-vien:#5b6aa8; --cham-tat:#a9b0c8; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg2:#ffffff; --panel:#ffffff; --line:#d6dbea; --text:#151a33; --muted:#5f6787;
  --sanh:#f7f8fc; --luoi:#dde2ef; --nhan-nen:#ffffff; --ban-mat:#c9a37a; --ban-1:#8a6a4a; --ban-2:#a07b55;
  --bot-dau:#ffffff; --bot-than:#2a3360; --bot-vien:#5b6aa8; --cham-tat:#a9b0c8; color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:72px 1fr 40px;height:100%}

/* thanh đầu */
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg2)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-mark{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--purple));box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent);border:0;overflow:hidden;flex:none}
.logo-mark img{width:100%;height:100%;object-fit:cover}
.logo small{display:block;font-size:10px;letter-spacing:.22em;color:var(--cyan);font-weight:700}
.ten-cty{font-size:20px;font-weight:800;letter-spacing:.02em;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 4px;margin-left:-5px;width:15ch;max-width:100%}
.ten-cty:hover{border-color:var(--line)}
.cmd{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 6px 6px 14px}
.cmd input{flex:1;background:none;border:0;outline:none;min-width:0}
.cmd button,.nut{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--panel)}
.nut-cam,.cmd .nut-cam{background:var(--accent);border-color:var(--accent);color:#1a0d00}
.nut:hover{border-color:var(--accent)}
.dong-ho{text-align:right}
.dong-ho small{font-size:11px;color:var(--muted)}
.dong-ho div{font:700 24px var(--so);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.nut-icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}

/* cột trái */
aside{border-right:1px solid var(--line);padding:14px 12px;overflow:auto;background:var(--bg2)}
.side-h{font-size:10px;letter-spacing:.2em;color:var(--muted);margin:16px 6px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.side-h button{font-size:11px;letter-spacing:0;border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 7px;color:var(--text)}
.side-h button:hover{border-color:var(--accent);color:var(--accent)}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:left}
.side-item:hover,.side-item.chon{background:color-mix(in srgb,var(--accent) 8%,var(--panel));border-color:var(--line)}
.side-item .d{width:9px;height:9px;border-radius:50%;flex:none}
.side-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .tag{font-size:10.5px;color:var(--muted);white-space:nowrap}
.side-item.tat .t{opacity:.5;text-decoration:line-through}
.side-phong{font-size:11px;color:var(--muted);margin:8px 10px 2px;font-weight:600}
.pill{font:700 11px var(--so);padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.rule{margin:16px 4px 0;padding:12px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:10px;background:color-mix(in srgb,var(--gold) 7%,transparent);font-size:12px;line-height:1.5}
.rule b{color:var(--gold);display:block;margin-bottom:4px;font-size:11px;letter-spacing:.12em}

/* giữa */
main{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:14px 18px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);position:relative;overflow:hidden;text-align:left}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c,var(--cyan))}
.stat small{font-size:10px;letter-spacing:.14em;color:var(--c,var(--cyan));font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font:700 24px var(--so);display:block;margin:2px 0;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;position:relative;min-height:0}
svg#office{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-x pan-y;transition:right .25s}
.stage.mo svg#office{right:360px}
.badge{position:absolute;right:18px;top:10px;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:999px;background:var(--bg2)}
.tabs{position:absolute;left:18px;bottom:12px;display:flex;gap:8px;z-index:2}
.tabs button{border:1px solid var(--line);background:var(--bg2);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.view{position:absolute;inset:0;padding:26px 36px 70px;overflow:auto;display:none;background:var(--bg)}
.view.on{display:block}
.view h2{font-size:18px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.14em;color:var(--muted)}
td .cd{font-family:var(--so);color:var(--cyan)}
.trong{color:var(--muted);padding:24px 0;line-height:1.7}

/* svg */
.lbl-t{font:800 14px var(--font);fill:var(--text)}
.lbl-s{font:500 10px var(--font);fill:var(--muted)}
.ten-bot{font:600 10px var(--font);fill:var(--text)}
.phong-g{cursor:grab}
.phong-g:hover .san{filter:brightness(1.4)}
.phong-g.keo .san{stroke-dasharray:6 4}
.phong-g.dich .san{stroke-width:3}
.sua{cursor:text}
.sua:hover{text-decoration:underline}
.bot{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.bot.lam .than-bot{animation:lo 2.4s ease-in-out infinite}}
@keyframes lo{50%{transform:translateY(-3px)}}
.o-sua{position:fixed;z-index:20;font:800 14px var(--font);background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:6px;padding:3px 8px;min-width:150px}

/* ngăn kéo sửa */
.drawer{position:absolute;right:0;top:0;bottom:0;width:360px;background:var(--panel);border-left:1px solid var(--line);padding:22px 20px 30px;transform:translateX(105%);transition:transform .25s;overflow:auto;z-index:5}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:22px}
.drawer h3{font-size:20px;margin:4px 0 2px;padding-right:24px}
.drawer .kicker{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.drawer .role{color:var(--muted);font-size:13px;margin-bottom:16px}
.truong{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.truong>label,.truong>.nhan{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.truong small{color:var(--muted);font-size:12px}
.o{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%}
textarea.o{min-height:140px;resize:vertical;line-height:1.5}
.hang{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a0d00}
.cong-tac{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.switch{width:42px;height:24px;border-radius:999px;border:0;background:var(--cham-tat);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:21px}
.switch:disabled{opacity:.6;cursor:not-allowed}
.khoa{border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.55}
.khoa b{color:var(--text)}
.cuoi{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.nut.xoa{color:var(--pink)}
.mau-sac{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mau-sac button{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.mau-sac button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}

/* dải việc */
footer{grid-column:1/3;display:flex;align-items:center;border-top:1px solid var(--line);background:var(--bg2);overflow:hidden;font-size:13px;padding-right:max(12px,env(safe-area-inset-right,0px))}
footer .live{flex:none;padding:0 14px 0 max(14px,env(safe-area-inset-left,0px));color:var(--green);font-weight:800;letter-spacing:.14em;font-size:11px;display:flex;align-items:center;gap:6px}
footer .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
@media (prefers-reduced-motion:no-preference){footer .live::before{animation:nhay 1.2s infinite}}
@keyframes nhay{50%{opacity:.25}}
.tick{display:flex;gap:34px;white-space:nowrap;color:var(--muted);overflow:hidden}
.tick b{color:var(--accent);font-weight:600}
.tick{flex:1;min-width:0}
.nguon{flex:none;margin-left:12px;font-size:11.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nguon:hover{color:var(--accent)}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto 34px;height:auto;min-height:100%}
  header,footer{grid-column:1}
  header{flex-wrap:wrap;padding-block:10px;gap:10px}
  .cmd,.dong-ho{display:none}
  aside{order:3;border-right:0;border-top:1px solid var(--line)}
  footer{order:4}
  header{order:0}
  main{order:2}
  .stats{display:flex;overflow-x:auto;gap:8px;padding:10px 12px 2px;scrollbar-width:none}
  .stat{flex:0 0 140px}
  .stage{height:70vh;min-height:420px;overflow-x:auto}
  svg#office{width:900px;right:auto}
  .drawer{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;max-height:78vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
}
</head>
<body>
</style>
<style>
/* bước cài đặt lần đầu */
.mo-dau{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.mo-dau[hidden]{display:none}
.hop{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.buoc{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.hop h2{font-size:24px;margin:6px 0 4px;text-wrap:balance}
.hop .goi{color:var(--muted);margin-bottom:18px;line-height:1.55}
.luoi-mh{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.mh{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mh:hover{border-color:var(--accent)}
.mh[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mh b{font-size:15px}
.mh span{font-size:12.5px;color:var(--muted);line-height:1.45}
.mh i{font-style:normal;font-size:22px}
.hang-nut{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:6px}
.buoc-tg{counter-reset:b;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.buoc-tg>div{display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.buoc-tg>div::before{counter-increment:b;content:counter(b);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a0d00;font-weight:800;display:grid;place-items:center;font-size:13px}
.ma{font:700 20px var(--so);letter-spacing:.08em;background:var(--bg);border:1px dashed var(--accent);border-radius:8px;padding:6px 12px;display:inline-block;margin-top:4px;user-select:all}
.bao{font-size:13px;margin-top:6px}
.bao.loi{color:var(--pink)}
.bao.ok{color:var(--green)}
code{font-family:var(--so);font-size:.92em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
</style>

  <header>
    <div class="logo">
      <button class="logo-mark" id="logo" title="Đổi logo" aria-label="Đổi logo"></button>
      <input type="file" id="logoFile" accept="image/*" hidden>

    <div class="dong-ho"><small id="ngay"></small><div id="gio">00:00:00</div></div>

      <div class="view" id="v-so"></div>
      <div class="tabs">
        <button class="on" data-v="office">Văn phòng 2.5D</button>

 {nut:"Viết bài bán hàng",ten:"Content",phong:"Marketing",nv:"Mỗi sáng đọc file tai-lieu/sanpham.txt, chọn 1 sản phẩm chưa đăng gần đây.\nViết 1 bài Facebook 80–150 chữ giới thiệu sản phẩm đó: câu đầu nói đúng nỗi lo của khách, 2–3 câu lợi ích thật, giá, cách đặt hàng.\nXưng mình – bạn, giọng gần gũi, không nói quá.\nKhông bịa giá, bịa khuyến mãi. Thiếu thông tin thì ghi [cần điền].",lich:{kieu:"gio",gio:"05:37"},gui:"khay",model:"manh"},

/* ---------------- chạy thử ---------------- */
async function chayThu(n,dem=0){
  if(LIVE){try{await api("/api/chay",{id:n.id});pushTick(`Đã giao <b>${esc(n.ten)}</b> chạy thử, xong sẽ vào khay`)}catch(e){$("#nBao")&&($("#nBao").textContent=e.message)}return}
  if(!n||dem>10)return;lam.add(n.id);pushTick(`<b>${esc(n.ten)}</b> bắt đầu làm việc`);veSan();veAside();
  setTimeout(()=>{lam.delete(n.id);const m=NV(n.chuyen);
    if(m&&m.bat){pushTick(`<b>${esc(n.ten)}</b> làm xong, chuyển cho <b>${esc(m.ten)}</b>`);chayThu(m,dem+1)}
    else{pushTick(`<b>${esc(n.ten)}</b> làm xong, xếp vào khay chờ ${esc(S.sep)} duyệt`);veSan();veAside()}},5000)}

/* ---------------- tab lịch + sổ ---------------- */
function veLich(){
  const ds=S.nv.filter(n=>!n.cung),dau=S.nv.filter(n=>n.chuyen&&!nguonCua(n.id).length);
  $("#v-lich").innerHTML=`<h2>Lịch &amp; luồng việc</h2>${ds.length?`<div style="overflow-x:auto"><table><thead><tr><th>NHÂN VIÊN</th><th>PHÒNG</th><th>LỊCH</th><th>GỌI THẲNG</th><th>TRẠNG THÁI</th></tr></thead><tbody>${ds.map(n=>`<tr><td>${esc(n.ten)}</td><td>${esc((P(n.phong)||{}).ten)}</td><td class="cd">${esc(moTaLich(n))}</td><td class="cd">${goTat(n.ten)}</td><td>${n.bat?(lam.has(n.id)?"Đang làm":"Đang trực"):"Nghỉ"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="trong">Chưa có nhân viên nào. Bấm + ở một phòng để tuyển người đầu tiên.</p>`}
  <h2 style="margin-top:26px">Luồng việc</h2>${dau.length?dau.map(n=>`<p class="trong" style="padding:6px 0">${chuoi(n).map(x=>`<b>${esc(x.ten)}</b>`).join(" → ")} → ${esc(S.sep)} duyệt</p>`).join(""):`<p class="trong">Chưa có chuỗi việc nào. Mở một nhân viên, chọn "Làm xong chuyển cho" để nối việc.</p>`}
  <p class="trong">Khay việc của ${esc(S.sep)}: ${S.khayGio.join(" · ")}</p>`;
}
const tien=n=>{n=+n;const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"tr":a>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"k":n+"đ"};
function veSo(){const so=LIVE&&TT?TT.so:{thu:0,chi:0,ds:[]};
  $("#v-so").innerHTML=`<h2>📒 Sổ kế toán công việc</h2><p class="trong" style="padding:4px 0 14px">Tháng này: thu <b>${tien(so.thu)}</b> · chi <b>${tien(so.chi)}</b> · còn <b>${tien(so.thu-so.chi)}</b></p>
  ${so.ds.length?`<div style="overflow-x:auto"><table><thead><tr><th>NGÀY</th><th>LOẠI</th><th>SỐ TIỀN</th><th>NỘI DUNG</th></tr></thead><tbody>${so.ds.slice().reverse().map(r=>`<tr><td class="cd">${esc(r.ngay.replace("T"," "))}</td><td>${r.loai==="thu"?"Thu":"Chi"}</td><td class="cd">${tien(r.so_tien)}</td><td>${esc(r.noi_dung)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="trong">Chưa có khoản nào.<br>Nhắn <b>/chi 200k mua tên miền</b> hoặc <b>/thu 3tr làm web cho khách</b> trong nhóm Telegram, Kế Toán sẽ ghi vào đây.</p>`}`}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));if(b.dataset.v!=="office"){(b.dataset.v==="lich"?veLich:veSo)();$("#v-"+b.dataset.v).classList.add("on")}});

/* ---------------- dải việc ---------------- */
let ticks=[];
function pushTick(h){ticks.unshift(`<span>${new Date().toTimeString().slice(0,5)} · ${h}</span>`);ticks=ticks.slice(0,8);$("#tick").innerHTML=ticks.join("")}
function giaLap(){if(lam.size||LIVE)return;const ds=S.nv.filter(n=>n.bat&&!n.cung&&!nguonCua(n.id).length);if(ds.length)chayThu(ds[Math.floor(Math.random()*ds.length)])}

/* ---------------- bước cài đặt lần đầu ---------------- */
let nhap={cty:"",sep:"Sếp",mh:"shop"};
function moDau(buoc,lamLai){
  const m=$("#moDau"),h=$("#hop");m.hidden=false;
  if(buoc===1){
    h.innerHTML=`<div class="buoc">BƯỚC 1/3</div><h2 id="hopTieuDe">Chào mừng tới văn phòng AI của bạn</h2><p class="goi">Một công ty thu nhỏ chạy trên máy này. CEO nghe lệnh qua Telegram, Thư Ký giữ khay việc, Kế Toán ghi sổ. Còn lại bạn tự tuyển.</p>
    <div class="truong"><label for="mdCty">TÊN CÔNG TY</label><input class="o" id="mdCty" placeholder="vd: Shop Áo Khoác Minh Anh" value="${esc(nhap.cty)}"></div>
    <div class="truong"><label for="mdSep">NHÂN VIÊN GỌI BẠN LÀ</label><input class="o" id="mdSep" placeholder="vd: Sếp, Anh Minh, Chị Lan" value="${esc(nhap.sep)}"></div>
    <div class="hang-nut"><span></span><button class="nut nut-cam" id="mdTiep">Tiếp</button></div>`;
    $("#mdCty").focus();
    $("#mdTiep").onclick=()=>{nhap.cty=$("#mdCty").value.trim()||"Văn Phòng AI";nhap.sep=$("#mdSep").value.trim()||"Sếp";moDau(2,lamLai)};
  } else if(buoc===2){
    h.innerHTML=`<div class="buoc">BƯỚC 2/3</div><h2 id="hopTieuDe">Công ty bạn làm gì?</h2><p class="goi">Chọn gần đúng nhất. Phòng ban và vài nhân viên gợi ý sẽ được dựng sẵn ở trạng thái nghỉ, bạn bật ai thì người đó làm. Sau này đổi tên, thêm, bớt thoải mái.</p>
    <div class="luoi-mh">${Object.entries(MO_HINH).map(([k,v])=>`<button class="mh" data-mh="${k}" aria-pressed="${nhap.mh===k}"><i>${v.i}</i><b>${v.ten}</b><span>${v.mo}</span></button>`).join("")}</div>
    <div class="hang-nut"><button class="nut" id="mdLui">Quay lại</button><button class="nut nut-cam" id="mdTiep">Dựng văn phòng</button></div>`;
    h.querySelectorAll("[data-mh]").forEach(x=>x.onclick=()=>{nhap.mh=x.dataset.mh;h.querySelectorAll("[data-mh]").forEach(y=>y.setAttribute("aria-pressed",y===x))});
    $("#mdLui").onclick=()=>moDau(1,lamLai);
    $("#mdTiep").onclick=async()=>{const giu=S&&lamLai?{logo:S.logo,accent:S.accent,khayGio:S.khayGio}:{};S=Object.assign(taoCongTy(nhap.mh,nhap.cty,nhap.sep),giu);
      if(LIVE){try{const j=await api("/api/luu",S);S=j.cfg}catch(e){alertHop(e.message);return}}else save();
      batDau();moDau(3)};
  } else {
    const t=LIVE&&TT?TT.telegram:null;
    if(!LIVE||t.daNoi){h.innerHTML=`<div class="buoc">BƯỚC 3/3</div><h2 id="hopTieuDe">Văn phòng đã dựng xong</h2><p class="goi">${LIVE?"Telegram đã nối. Nhắn thử vào nhóm một câu bất kỳ, CEO sẽ trả lời.":"Đây là bản xem thử nên chưa nối Telegram. Khi chạy trên máy, bước này hướng dẫn bạn tạo bot và nối nhóm."}<br><br>Bước tiếp theo: bấm vào một nhân viên đang nghỉ, đọc nhiệm vụ, sửa cho hợp việc của bạn rồi bật lên.</p>
      <div class="hang-nut"><span></span><button class="nut nut-cam" id="mdXong">Vào văn phòng</button></div>`;
      $("#mdXong").onclick=()=>{m.hidden=true};return}
    h.innerHTML=`<div class="buoc">BƯỚC 3/3</div><h2 id="hopTieuDe">Nối Telegram để ra lệnh từ điện thoại</h2><p class="goi">Nhân viên gửi việc qua Telegram, bạn bấm duyệt ngay trên điện thoại.</p>${khoiTelegram(t)}
    <div class="hang-nut"><span></span><button class="nut" id="mdSau">Để sau</button></div>`;
    ganTelegram(h);$("#mdSau").onclick=()=>{m.hidden=true};
  }
}
function alertHop(t){const p=document.createElement("p");p.className="bao loi";p.textContent=t;$("#hop").appendChild(p)}

/* ---------------- nối máy chủ ---------------- */
let lamTruoc="";
async function keoTrangThai(){
  try{TT=await api("/api/trangthai")}catch(e){$("#badge").textContent="Mất kết nối máy chủ · mở lại cửa sổ văn phòng";$("#badge").hidden=false;return}
  $("#badge").hidden=true;
  const moi=TT.lam.sort().join(",")+"|"+TT.telegram.daNoi+"|"+TT.claude+"|"+choDuyet();lam.clear();TT.lam.forEach(x=>lam.add(x));
  ticks=TT.suKien.slice().reverse().slice(0,8).map(e=>`<span>${e.t.slice(11,16)} · ${e.ai?`<b>${esc(e.ai)}</b> `:""}${esc(e.chu)}</span>`);$("#tick").innerHTML=ticks.join("");
  if(moi!==lamTruoc){lamTruoc=moi;veSan()}
  veStats();if(!document.activeElement||!$("#aside").contains(document.activeElement))veAside();
  if(!$("#moDau").hidden&&TT.telegram.daNoi&&$("#hop").querySelector(".ma"))moDau(3);
  if(ngan&&ngan.loai==="tg"&&TT.telegram.daNoi&&$("#dbody").querySelector(".ma"))veNgan();
  if($("#v-so").classList.contains("on"))veSo();
}
function veTatCa(){veSan();veAside();veStats();if(ngan)veNgan()}
function batDau(){$("#tenCty").value=S.cty;apMau();veLogo();veTatCa();const st=$(".stage");if(st.scrollWidth>st.clientWidth)st.scrollLeft=(st.scrollWidth-st.clientWidth)/2}

(async function khoiDong(){
  const th=luu("vpai-theme");if(th)document.documentElement.dataset.theme=th;
  try{const r=await fetch("/api/trangthai",{cache:"no-store"});if(r.ok){const j=await r.json();if("daCaiDat" in j){LIVE=true;TT=j}}}catch(e){}
  if(LIVE){
    $("#badge").hidden=true;
    if(TT.daCaiDat){S=TT.cfg;batDau();TT.lam.forEach(x=>lam.add(x));keoTrangThai();if(!TT.telegram.daNoi)pushTick("Chưa nối Telegram · bấm TELEGRAM cạnh bộ não để nối")}
    else{S=taoCongTy("shop","Văn Phòng AI","Sếp");batDau();moDau(1)}
    setInterval(keoTrangThai,2500);
  } else {
    S=luu("vpai-demo");
    if(S){batDau();pushTick(`<b>${esc(S.cty)}</b> mở cửa`)}else{S=taoCongTy("shop","Văn Phòng AI","Sếp");batDau();moDau(1)}
    if(!RM())setInterval(giaLap,9000);
  }
})();
</script>
</body>
</html>
